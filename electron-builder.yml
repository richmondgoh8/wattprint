appId: dev.richmondgoh8.wattprint
productName: Wattprint
copyright: Copyright (c) 2026 Richmond Goh
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
portable:
  artifactName: ${productName}-${version}-portable.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
publish: null

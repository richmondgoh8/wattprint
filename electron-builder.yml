appId: dev.richmondgoh8.wattprint
productName: Wattprint
copyright: Copyright (c) 2026 Richmond Goh
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/lhm
    to: lhm
  - from: resources/tray.ico
    to: tray.ico
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
portable:
  artifactName: ${productName}-${version}-portable.exe
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
publish: null

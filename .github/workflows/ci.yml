name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend svelte-check
        run: npm run check

      - name: Build renderer
        run: npm run build

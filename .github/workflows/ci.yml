name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go test
        run: |
          go vet ./...
          go test -race ./...

      - name: Frontend install
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend build
        working-directory: frontend
        run: npm run build

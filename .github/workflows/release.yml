name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath

      - name: List output
        run: ls -la build/bin/

      - name: Compute SHA-256
        shell: bash
        run: |
          cd build/bin
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.exe
            build/bin/*.sha256
          draft: true
          generate_release_notes: true
